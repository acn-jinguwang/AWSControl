name: Deploy MCP Server to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'aws_infra_mcp_server.py'
      - 'ec2_cloudformation.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy MCP server to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            aws_infra_mcp_server.py \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/mcp/aws_infra_mcp_server.py"

      - name: Update AWS config on EC2 (cross-account profile)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash << 'EOF'
          mkdir -p ~/.aws
          # foresta-asama プロファイルが未設定の場合のみ追加
          if ! grep -q '\[profile foresta-asama\]' ~/.aws/config 2>/dev/null; then
            cat >> ~/.aws/config << 'AWSCFG'
          [profile foresta-asama]
          role_arn = arn:aws:iam::237657481351:role/OrganizationAccountAccessRole
          credential_source = Ec2InstanceMetadata
          region = ap-northeast-1
          AWSCFG
            echo "foresta-asama profile added."
          else
            echo "foresta-asama profile already exists."
          fi
          echo "=== ~/.aws/config ==="
          cat ~/.aws/config
          echo "=== AssumeRole verify ==="
          aws sts get-caller-identity --profile foresta-asama
          EOF

      - name: Restart MCP service
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo systemctl restart mcp-aws && sleep 3 && sudo systemctl status mcp-aws --no-pager && echo '=== Deploy completed at $(date) ==='"
